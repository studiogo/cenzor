# Pilnuje, zeby biblioteki i akcje nie zostaly w tyle.
# Latki bezpieczenstwa GitHub wstawia sam; ten plik dotyczy zwyklych wersji.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "biblioteki"
    groups:
      wszystkie:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "akcje"
